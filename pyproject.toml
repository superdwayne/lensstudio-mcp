[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lens-studio-mcp"
version = "0.1.0"
description = "MCP server that proxies AI agent requests to Lens Studio's built-in MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dwayne" },
]
keywords = ["mcp", "lens-studio", "snapchat", "ar", "augmented-reality", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
lens-studio-mcp = "lens_studio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/superdwayne/lens-studio-mcp"
Repository = "https://github.com/superdwayne/lens-studio-mcp"
Issues = "https://github.com/superdwayne/lens-studio-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lens_studio_mcp"]
